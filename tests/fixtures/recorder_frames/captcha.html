<!doctype html>
<html><head><title>reCAPTCHA</title>
<style>
  body { margin: 0; font: 12px sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 40px; }
  .tile { border: 1px solid #aaa; box-sizing: border-box; background: #def; }
  #verify-button { display: block; width: 100%; height: 40px; margin: 0; }
</style>
</head>
<body>
<div id="grid">
  <div class="tile" tabindex="0">1</div><div class="tile" tabindex="0">2</div><div class="tile" tabindex="0">3</div>
  <div class="tile" tabindex="0">4</div><div class="tile" tabindex="0">5</div><div class="tile" tabindex="0">6</div>
</div>
<button id="verify-button" type="button">Verify</button>
</body>
</html>
