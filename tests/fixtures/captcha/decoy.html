<!doctype html>
<meta charset="utf-8">
<title>An ordinary form checkbox beside a widget</title>
<!--
  A sign-up form with a newsletter checkbox that must never be clicked, and a
  Turnstile-like widget (frame from a second origin). Query: ?widget=none
  leaves the widget out, so the page has a checkbox and no challenge at all.
-->
<style>
  body { font: 15px sans-serif; margin: 24px; }
  .cf-turnstile { width: 300px; height: 65px; margin-top: 16px; }
  iframe { border: 0; }
  label { display: block; margin: 12px 0; }
</style>
<h1>Create an account</h1>
<form id="f">
  <label><input type="text" name="user" value="ada"></label>
  <label><input type="checkbox" id="newsletter" name="newsletter"> Subscribe to the newsletter</label>
  <label><input type="checkbox" id="terms" name="terms"> I accept the terms</label>
  <div id="slot"></div>
  <input type="hidden" name="cf-turnstile-response" value="">
</form>
<p id="status">waiting</p>
<script>
  window.__clicks = [];
  window.__mouse = 0;
  addEventListener('mousedown', () => { window.__mouse += 1; }, true);
  if (new URLSearchParams(location.search).get('widget') !== 'none') {
    document.getElementById('slot').innerHTML =
      '<div class="cf-turnstile" data-sitekey="1x00000000000000000000AA">' +
      '<iframe id="cf-chl-widget-d1" ' +
      'title="Widget containing a Cloudflare security challenge" ' +
      'width="300" height="65" src="FAR/w"></iframe></div>';
  }
  addEventListener('message', (event) => {
    const data = event.data || {};
    if (data.sbFixture === 'click') window.__clicks.push(data);
    if (data.sbFixture === 'token') {
      document.querySelector('[name=cf-turnstile-response]').value = data.value;
      document.body.dataset.cleared = '1';
      document.getElementById('status').textContent = 'cleared';
    }
  });
</script>
