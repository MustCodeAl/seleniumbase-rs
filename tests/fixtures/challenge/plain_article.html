<!DOCTYPE html><html lang="en"><head><title>Ten tips for a calm morning</title></head><body><article><h1>Ten tips for a calm morning</h1><p>Tip four: when someone asks you to wait, say "just a moment" and mean it. Take one slow breath before you answer. A little patience goes a long way, and an access denied message on a door is only a sign, not a verdict.</p></article></body></html>
