name: Shell Completions

on:
  push:
    branches: [master, main, mustcodeal-rust-port]
    tags: ["v*"]
  pull_request:
    branches: [master, main, mustcodeal-rust-port]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The default feature set includes `gui` (enigo/rfd), which links
      # against GTK and X11 on Linux.
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libx11-dev libxdo-dev libxkbcommon-dev libxtst-dev \
            libssl-dev pkg-config

      # `sbrs` is the binary of the workspace package `seleniumbase-rs-cli`.
      - name: Generate completions
        run: |
          mkdir -p target/completions
          sbrs() { cargo run --quiet --package seleniumbase-rs-cli --bin sbrs -- "$@"; }
          sbrs completions bash > target/completions/sbrs.bash
          sbrs completions zsh > target/completions/_sbrs
          sbrs completions fish > target/completions/sbrs.fish
          sbrs completions elvish > target/completions/sbrs.elv
          sbrs completions powershell > target/completions/_sbrs.ps1

      - name: Upload completions artifact
        uses: actions/upload-artifact@v4
        with:
          name: shell-completions
          path: target/completions/*

      - name: Attach completions to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/completions/*
          fail_on_unmatched_files: true
