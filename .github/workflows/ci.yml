name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# The crate lives at the repository root, so no `working-directory` default is
# set. (This workflow used to target a `rust-port/` subdirectory of the
# upstream monorepo, which does not exist here, so its path filter matched
# nothing and it never ran.)

jobs:
  browser-smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # The default feature set includes `gui` (enigo/rfd), which links
      # against GTK and X11 on Linux.
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libx11-dev libxdo-dev libxkbcommon-dev libxtst-dev \
            libssl-dev pkg-config

      - name: Verify Chrome and chromedriver are available
        # GitHub-hosted runners ship Chrome + chromedriver preinstalled.
        run: |
          google-chrome --version
          chromedriver --version

      - name: Run real-browser smoke tests
        run: cargo test --test browser_smoke -- --ignored

  check:
    name: Check (${{ matrix.os }}, features=${{ matrix.features || 'default' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ""
          - os: ubuntu-latest
            features: "s3,azure,gcp"
          - os: ubuntu-latest
            features: "mcp-server"
          - os: ubuntu-latest
            features: "playwright"
          - os: macos-latest
            features: ""
          - os: macos-latest
            features: "s3,azure,gcp"
          - os: macos-latest
            features: "mcp-server"
          - os: macos-latest
            features: "playwright"
          - os: windows-latest
            features: ""
          - os: windows-latest
            features: "s3,azure,gcp"
          - os: windows-latest
            features: "mcp-server"
          - os: windows-latest
            features: "playwright"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install GUI build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libx11-dev libxdo-dev libxkbcommon-dev libxtst-dev \
            libssl-dev pkg-config

      - name: Install Chrome and chromedriver (Linux)
        if: runner.os == 'Linux' && matrix.features != 'playwright'
        # GitHub-hosted Ubuntu runners ship Chrome and chromedriver, and
        # `google-chrome-stable` is not in the default apt sources, so installing
        # it here would fail. The unit tests do not drive a browser; the real
        # browser tests run in the browser-smoke job.
        run: |
          google-chrome --version || true
          chromedriver --version || true

      - name: Install Chrome and chromedriver (macOS)
        if: runner.os == 'macOS' && matrix.features != 'playwright'
        run: |
          brew install --cask google-chrome
          brew install chromedriver
          /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --version
          chromedriver --version

      - name: Install Chrome and chromedriver (Windows)
        if: runner.os == 'Windows' && matrix.features != 'playwright'
        shell: pwsh
        run: |
          choco install googlechrome chromedriver -y
          & "C:\Program Files\Google\Chrome\Application\chrome.exe" --version
          chromedriver --version

      - name: Install Python for playwright feature
        if: matrix.features == 'playwright'
        uses: jdx/mise-action@v2
        with:
          install: true
          tools: python@3.14

      - name: Set Python library path (Unix)
        if: matrix.features == 'playwright' && runner.os != 'Windows'
        run: |
          PY_PREFIX=$($HOME/.local/share/mise/shims/python3 -c 'import sysconfig; print(sysconfig.get_config_var("prefix"))')
          echo "PY_LIB_DIR=$PY_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Set Python library path (Windows)
        if: matrix.features == 'playwright' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $py = & "$env:USERPROFILE\.local\share\mise\shims\python3.exe" -c 'import sysconfig; print(sysconfig.get_config_var("prefix"))'
          echo "PY_LIB_DIR=$py\lib" | Out-File -FilePath "$env:GITHUB_ENV" -Append

      - name: Build
        env:
          DYLD_LIBRARY_PATH: ${{ env.PY_LIB_DIR }}
          LD_LIBRARY_PATH: ${{ env.PY_LIB_DIR }}
        run: |
          if ("${{ matrix.features }}" -ne "") {
            cargo build --features "${{ matrix.features }}"
          } else {
            cargo build
          }
        shell: pwsh

      - name: Run tests
        env:
          DYLD_LIBRARY_PATH: ${{ env.PY_LIB_DIR }}
          LD_LIBRARY_PATH: ${{ env.PY_LIB_DIR }}
        run: |
          if ("${{ matrix.features }}" -ne "") {
            cargo test --features "${{ matrix.features }}"
          } else {
            cargo test
          }
        shell: pwsh

      - name: Run Clippy
        env:
          DYLD_LIBRARY_PATH: ${{ env.PY_LIB_DIR }}
          LD_LIBRARY_PATH: ${{ env.PY_LIB_DIR }}
        run: |
          if ("${{ matrix.features }}" -ne "") {
            cargo clippy --all-targets --features "${{ matrix.features }}" -- -D warnings
          } else {
            cargo clippy --all-targets -- -D warnings
          }
        shell: pwsh

      - name: Check formatting
        run: cargo fmt --all -- --check

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep this in step with `rust-version` in Cargo.toml and the Dockerfile
      # base image. The floor comes from the dependency graph, not from this
      # crate's own source.
      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libx11-dev libxdo-dev libxkbcommon-dev libxtst-dev \
            libssl-dev pkg-config

      - name: Check against the declared rust-version
        run: cargo check --all-targets

  # The Tauri example carries its own manifest outside the workspace, so the
  # jobs above never build it and regressions in it go unnoticed.
  tauri-example:
    name: Tauri profile-manager example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/tauri-profile-manager/src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libx11-dev \
            libxdo-dev \
            libxkbcommon-dev \
            libxtst-dev \
            pkg-config

      - name: Check formatting
        working-directory: examples/tauri-profile-manager/src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: examples/tauri-profile-manager/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: examples/tauri-profile-manager/src-tauri
        run: cargo test

  supply-chain:
    name: Supply chain (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  docs:
    name: Build and publish docs
    runs-on: ubuntu-latest
    needs: check
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install mdbook
        run: cargo install mdbook

      - name: Build docs
        run: mdbook build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
