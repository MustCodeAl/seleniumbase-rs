name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# The workspace root is the repository root, so no `working-directory` default
# is set. (This workflow used to target a `rust-port/` subdirectory of the
# upstream monorepo, which does not exist here, so its path filter matched
# nothing and it never ran.)
#
# The workspace has four packages: the library `seleniumbase-rs` at the root, the
# command line `seleniumbase-rs-cli` in `crates/cli`, the tests-only
# `seleniumbase-rs-own-imports` in `crates/own-imports` and the Playwright bridge
# `seleniumbase-rs-playwright` in `crates/playwright`. `default-members` names the
# first two, so a plain `cargo build`, `cargo test` or `cargo clippy` covers both;
# the `library` job runs the other two.
# Features that only the library defines (`s3`, `azure`, ...) apply to the
# library; the command line forwards the ones it needs.

jobs:
  browser-smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # The default build has no `gui` feature, so GTK and X11 are not needed.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Verify Chrome and chromedriver are available
        # GitHub-hosted runners ship Chrome + chromedriver preinstalled.
        run: |
          google-chrome --version
          chromedriver --version

      - name: Run real-browser smoke tests
        run: cargo test -p seleniumbase-rs --test browser_smoke -- --ignored

  check:
    name: Check (${{ matrix.os }}, features=${{ matrix.features || 'default' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ""
          - os: ubuntu-latest
            features: "s3,azure,gcp"
          - os: ubuntu-latest
            features: "mcp-server,pdf"
          # The `sb` fixtures and the Gherkin steps: the mock-driven tests of `testing` and `bdd`.
          - os: ubuntu-latest
            features: "mcp-server,test-util,testing,bdd"
          # `gui` and `tui` are off by default, so the default build skips them.
          - os: ubuntu-latest
            features: "gui,tui"
          - os: macos-latest
            features: ""
          - os: macos-latest
            features: "s3,azure,gcp"
          - os: macos-latest
            features: "mcp-server,pdf"
          - os: macos-latest
            features: "gui,tui"
          - os: windows-latest
            features: ""
          - os: windows-latest
            features: "s3,azure,gcp"
          - os: windows-latest
            features: "mcp-server,pdf"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install GUI build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libx11-dev libxdo-dev libxkbcommon-dev libxtst-dev \
            libssl-dev pkg-config

      - name: Install Chrome and chromedriver (Linux)
        if: runner.os == 'Linux'
        # GitHub-hosted Ubuntu runners ship Chrome and chromedriver, and
        # `google-chrome-stable` is not in the default apt sources, so installing
        # it here would fail. The unit tests do not drive a browser; the real
        # browser tests run in the browser-smoke job.
        run: |
          google-chrome --version || true
          chromedriver --version || true

      - name: Install Chrome and chromedriver (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask google-chrome
          brew install chromedriver
          /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --version
          chromedriver --version

      - name: Install Chrome and chromedriver (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install googlechrome chromedriver -y
          & "C:\Program Files\Google\Chrome\Application\chrome.exe" --version
          chromedriver --version

      - name: Build
        run: |
          if ("${{ matrix.features }}" -ne "") {
            cargo build --features "${{ matrix.features }}"
          } else {
            cargo build
          }
        shell: pwsh

      - name: Run tests
        run: |
          if ("${{ matrix.features }}" -ne "") {
            cargo test --features "${{ matrix.features }}"
          } else {
            cargo test
          }
        shell: pwsh

      - name: Run Clippy
        run: |
          if ("${{ matrix.features }}" -ne "") {
            cargo clippy --all-targets --features "${{ matrix.features }}" -- -D warnings
          } else {
            cargo clippy --all-targets -- -D warnings
          }
        shell: pwsh

      - name: Check formatting
        run: cargo fmt --all -- --check

  # The command line turns `pdf` and `mcp-server` on in the library, and a
  # workspace build unifies features, so the matrix above never builds the library
  # with its own defaults. This job does: it is what a project that depends on
  # `seleniumbase-rs` compiles and tests.
  library:
    name: Library alone (default features)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test -p seleniumbase-rs

      - name: Run Clippy
        run: cargo clippy -p seleniumbase-rs --all-targets -- -D warnings

      # `crates/own-imports` lists only seleniumbase-rs (and rstest-bdd). Its tests and the
      # doctest over the golden files of `sbrs mkfile`, `sbrs mkdir` and the recorder import
      # nothing else, so a re-export that stops working, or a generator that writes an
      # import of another crate, fails here. It is not a default member.
      - name: Imports resolve for a crate that lists only seleniumbase-rs
        run: cargo test -p seleniumbase-rs-own-imports

      # `crates/playwright` is Stealthy Playwright Mode: rustwright attached to a stealthy
      # sb_cdp browser. It is a workspace member and not a default member, so the matrix above
      # never builds the Playwright engine. Its tests that start Chrome are `#[ignore]`d; what
      # runs here compiles the attach path and its doctests.
      - name: Playwright bridge (crates/playwright)
        run: |
          cargo clippy -p seleniumbase-rs-playwright --all-targets -- -D warnings
          cargo test -p seleniumbase-rs-playwright

      # A broken intra-doc link, a link to a private item or a bare URL fails the build.
      # The first command documents the default members the way a workspace build unifies
      # their features; the others document the library with its own defaults and the
      # Playwright bridge.
      - name: Rustdoc with warnings denied
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --no-deps --features "mcp-server test-util testing bdd"
          cargo doc --no-deps -p seleniumbase-rs
          cargo doc --no-deps -p seleniumbase-rs-playwright


      # The command line turns `pdf` on by default, so the matrix above never runs
      # the tests that expect a build without it (the exit status 2 and the hint).
      - name: Command line without default features
        run: |
          cargo test -p seleniumbase-rs-cli --no-default-features
          cargo clippy -p seleniumbase-rs-cli --no-default-features --all-targets -- -D warnings

      # The library must stay free of the command-line crates (they belong to
      # crates/cli); tests/library_manifest.rs checks the manifest, this checks the
      # resolved graph.
      - name: No command-line crates in the library's dependency graph
        run: |
          if cargo tree -p seleniumbase-rs -e normal --prefix none | grep -E '^(usage-rs|usage-argv|usage-derive|usage-lib|clap|clap_complete|clap_complete_fig|clap_usage) '; then
            echo "::error::the library depends on a command-line crate"
            exit 1
          fi

      # The Playwright engine belongs to crates/playwright; tests/library_manifest.rs checks
      # the manifest, this checks the resolved graph.
      - name: No Playwright engine in the library's dependency graph
        run: |
          if cargo tree -p seleniumbase-rs -e normal --prefix none | grep -E '^rustwright'; then
            echo "::error::the library depends on the rustwright Playwright engine"
            exit 1
          fi

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep this in step with `rust-version` in Cargo.toml and the Dockerfile
      # base image. The crate tracks the newest stable release; this job fails
      # when a dependency starts to need something newer than the declared
      # version.
      - name: Install Rust 1.99
        uses: dtolnay/rust-toolchain@1.99

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libx11-dev libxdo-dev libxkbcommon-dev libxtst-dev \
            libssl-dev pkg-config

      - name: Check against the declared rust-version
        run: cargo check --all-targets --features gui,tui

  # The Tauri example carries its own manifest outside the workspace, so the
  # jobs above never build it and regressions in it go unnoticed.
  tauri-example:
    name: Tauri profile-manager example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/tauri-profile-manager/src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libx11-dev \
            libxdo-dev \
            libxkbcommon-dev \
            libxtst-dev \
            pkg-config

      - name: Check formatting
        working-directory: examples/tauri-profile-manager/src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: examples/tauri-profile-manager/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: examples/tauri-profile-manager/src-tauri
        run: cargo test

  supply-chain:
    name: Supply chain (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # The root manifest is also a package: without --workspace only the library
          # is a graph root, and crates/cli (the binaries) goes unchecked.
          arguments: --all-features --workspace

  docs:
    name: Build and publish docs
    runs-on: ubuntu-latest
    needs: check
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install mdbook
        run: cargo install mdbook

      - name: Build docs
        run: mdbook build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
