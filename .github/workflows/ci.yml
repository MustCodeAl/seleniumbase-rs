name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }}, features=${{ matrix.features || 'default' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features: ["", "s3,azure,gcp", "mcp-server", "playwright"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Chrome and chromedriver
        if: matrix.features != 'playwright'
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable chromium-chromedriver
            google-chrome --version
            chromedriver --version
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install --cask google-chrome
            brew install chromedriver
            /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome --version
            chromedriver --version
          fi

      - name: Install Python for playwright feature
        if: matrix.features == 'playwright'
        uses: jdx/mise-action@v2
        with:
          install: true
          tools: python@3.14

      - name: Set Python library path
        if: matrix.features == 'playwright'
        run: |
          PY_PREFIX=$($HOME/.local/share/mise/shims/python3 -c 'import sysconfig; print(sysconfig.get_config_var("prefix"))')
          echo "PY_LIB_DIR=$PY_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Build
        env:
          DYLD_LIBRARY_PATH: ${{ env.PY_LIB_DIR }}
          LD_LIBRARY_PATH: ${{ env.PY_LIB_DIR }}
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo build --features "${{ matrix.features }}"
          else
            cargo build
          fi

      - name: Run tests
        env:
          DYLD_LIBRARY_PATH: ${{ env.PY_LIB_DIR }}
          LD_LIBRARY_PATH: ${{ env.PY_LIB_DIR }}
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo test --features "${{ matrix.features }}"
          else
            cargo test
          fi

      - name: Run Clippy
        env:
          DYLD_LIBRARY_PATH: ${{ env.PY_LIB_DIR }}
          LD_LIBRARY_PATH: ${{ env.PY_LIB_DIR }}
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo clippy --all-targets --features "${{ matrix.features }}" -- -D warnings
          else
            cargo clippy --all-targets -- -D warnings
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check against declared rust-version
        run: cargo check --all-targets

  tauri-example:
    name: Tauri profile-manager example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/tauri-profile-manager/src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            libx11-dev \
            libxdo-dev

      # This example carries its own manifest, so the main matrix never builds
      # it and regressions in it go unnoticed until someone opens it.
      - name: Check formatting
        working-directory: examples/tauri-profile-manager/src-tauri
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: examples/tauri-profile-manager/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: examples/tauri-profile-manager/src-tauri
        run: cargo test

  supply-chain:
    name: Supply chain (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
