---
name: Convert a Puppeteer script to Rust with sbrs
command: "sbrs import-puppeteer {{file}} -o {{output}}"
tags: ["sbrs", "seleniumbase-rs", "migration", "puppeteer"]
description: Writes a Rust test from a Puppeteer script. Statements it cannot convert stay as TODO comments.
arguments:
  - name: file
    description: The Puppeteer script
    default_value: script.js
  - name: output
    description: The Rust file to write
    default_value: tests/script.rs
source_url: "https://github.com/MustCodeAl/seleniumbase-rs"
author: seleniumbase-rs
shells: []
