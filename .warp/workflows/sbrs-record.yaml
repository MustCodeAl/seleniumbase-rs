---
name: Record browser actions with sbrs
command: "sbrs record {{url}} -o {{output}}"
tags: ["sbrs", "seleniumbase-rs", "recorder"]
description: Opens the page, records what you do, and writes the actions as JSON or YAML.
arguments:
  - name: url
    description: The page to start on
    default_value: https://seleniumbase.io
  - name: output
    description: The action file to write (.json or .yaml)
    default_value: actions.json
source_url: "https://github.com/MustCodeAl/seleniumbase-rs"
author: seleniumbase-rs
shells: []
