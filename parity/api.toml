[options_sb."time_limit"]
status = "composed"
rust = "BaseCase::set_time_limit"
note = "Once the test has run longer than the limit (counted from creating the BaseCase), its next open, readiness wait or element action fails with a time-limit error; waits are cut to the time left. A test that does none of those is not interrupted: wrap it in `tokio::time::timeout` for a hard stop."

[options_sb."timeout_multiplier"]
status = "composed"
rust = "BaseCase::set_timeout"
note = "Call `set_timeout(10 * multiplier)`: the default wait is 10 seconds. A timeout passed to a method explicitly is not multiplied, which matches Python, where only the default timeouts are."

