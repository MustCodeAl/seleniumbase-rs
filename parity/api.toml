[cdp."gui_click_and_hold"]
status = "composed"
rust = "Gui::mouse_down"
note = "Feature `gui`. Gui::mouse_down presses at the pointer's current position without moving it, so move first: take `let r = page.locator(selector).screen_rect().await?`, `gui.move_mouse(x, y)?` to the centre `(r.x + r.width / 2.0, r.y + r.height / 2.0)`, then `gui.mouse_down()?`, sleep for the hold time and `gui.mouse_up()?`."

[cdp."gui_click_captcha"]
status = "implemented"
rust = "Page::gui_click_captcha"
note = "Feature `gui`. Page::gui_click_captcha finds the widget as `Page::solve_captcha` does, works out the checkbox's screen point (the window from `Browser.getWindowForTarget`, where the page starts inside it, the widget's frame, the vendor's checkbox offset), moves the real pointer there along a human path and presses; the DataDome slider is dragged. `Page::gui_captcha_plan` gives the point without moving anything. It has unit and mock coverage only: the arithmetic, the vendor offsets, the CDP calls and the pointer steps are tested against a mocked browser and a recording pointer; it has never moved the real pointer or been tried on a live CAPTCHA."
divergence = "Python's DataDome flow opens the challenge frame in a new tab and drags between the page's own slider elements; here the handle is taken to be 30 pixels in from the frame's left edge and is dragged to 30 pixels from its right edge. A headless browser and a minimised window are refused, and a point outside the main display is refused as PyAutoGUI refuses it."

