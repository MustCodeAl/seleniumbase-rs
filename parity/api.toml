[cdp."find_element"]
status = "composed"
rust = "Page::locator"
note = "`page.locator(selector)` returns a Locator, the handle every element action goes through; CSS, XPath and `tag:contains(\"text\")` selectors work. Python also searches by text when the selector is plain text, which Rust does not guess: use `SelectorBuf::containing_text`. Python's `best_match` option is not offered."

[cdp."find_element_by_text"]
