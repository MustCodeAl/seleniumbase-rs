[options_pytest."--rcs"]
status = "implemented"
rust = "BrowserConfig::with_reuse_module_session"
note = "Alias of --reuse-class-session upstream. Also `sbrs --rcs` (aliases `--reuse-class-session`, `--reuse_class_session`), `Settings::reuse_class_session` and SB_REUSE_CLASS_SESSION; like upstream it turns --reuse-session on. Rust has no test classes, so the module that holds the test plays the part: it is read from the name libtest gives the test's thread (`login::tests::valid` is in `login::tests`; the tests at the root of an integration test file share the root module). BrowserConfig::with_reuse_class_session(name) shares a browser among the tests that pass the same name instead. Tests of different classes never share a browser; the rest is as for --reuse-session."
divergence = "Python quits the class's browser when the next class starts (setUpClass and tearDownClass); here it stays open until the idle timeout, so the browsers of several modules can be open at once. A BaseCase made outside a libtest thread (a custom harness, a spawned task on a Tokio worker) counts as the root module."

