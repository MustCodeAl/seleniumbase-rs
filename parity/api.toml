[basecase."generate_referral"]
status = "implemented"
rust = "BaseCase::generate_referral"
note = "A real click-through: it opens start_page (an empty string means the current page), builds a link to destination_page in it with a script and clicks it, so the destination receives a Referer header. With a selector, that element is clicked on the destination page too."
divergence = "Builds the link with DOM calls and quotes the URL, where Python pastes it into markup; waits for the destination's readyState after the click, where Python only pauses 0.15 s. An invalid page is SeleniumBaseError::Parse, checked before the browser is touched."

