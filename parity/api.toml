note = "Alias of caseplans upstream; terminal UI instead of Tkinter, as for `sbrs caseplans`, and `sbrs case-plans` (and `sbrs case_plans`) is an alias of it here too."

[cli."caseplans"]
status = "implemented"
rust = "sbrs caseplans"
note = "Terminal UI instead of Tkinter (feature `tui`): lists the Rust test functions under a folder, creates, edits and saves `case_plans/<test>.md` for each and writes `case_summary.md`; without `tui` it prints a hint and exits with status 2, as `sbrs commander` does. `--starter` keeps the earlier command that writes a fixed CASE_PLANS.md checklist. `-k FILTER` starts with the list narrowed to the test ids that contain FILTER, as `/` does in the app."
divergence = "Python lists what pytest collects (`file.py::Class::method`); here the test functions are found by reading the files, so a `#[test]` inside a string looks like a test. Plans and the summary are written with LF line ends, not CRLF."

