[options_pytest."--codegen"]
status = "composed"
rust = "BrowserConfig::with_recorder_mode"
note = "Recorder Mode (`--rec`, `SB_RECORDER`, `BrowserConfig::with_recorder_mode`) runs Python's page recorder in every tab; when the test quits, the actions are processed as Python does and written to `recordings/<test>_rec.rs` (an rstest test on the `sb` fixture) and `.json`, with `.feature` under `--rec-behave`. `sbrs mkrec` (aliases `codegen`, `record`) records from the command line."

