[cli."recorder"]
status = "implemented"
rust = "sbrs recorder"
note = "Python's Recorder Desktop App as a terminal app (build with the `tui` feature; without it the command prints a hint and exits with status 2). A form for the file name, the start URL, Overwrite, the browser (Chrome, Chromium, Edge, Opera, Brave, Comet), Stealth Mode / UC, the output format (test, `--rec-sb-mgr` script, `--rec-sb-cdp`, Gherkin) and `--ee`; Record runs `sbrs mkrec FILE --url=URL --headed ...` with the terminal handed to it, Run starts `cargo test --test NAME` (or `cargo run --example`) and Replay runs `sbrs replay recordings/NAME_rec.json`, with a Demo Mode box for both. `--url`, `--browser`, `--uc`/`--cdp`, `--ee`, `--rec-behave`, `--rec-sb-mgr` and `--rec-sb-cdp` fill the form in at the start, as Python reads `--uc`, `--behave` and `--ee`."
divergence = "Python opens a Tkinter window that stays open while the recording runs in another process, and its Playback buttons run the Python file. Here Record suspends the terminal UI until `mkrec` ends (the person types `c` and Enter in that terminal, or presses SHIFT+ESC with `--ee`), because `mkrec` reads the terminal; Run needs the test in `tests/` or `examples/` (cargo runs a test by its file name) and Replay needs no compile. The file is a `.rs` name, and it is not asked before overwriting: Overwrite is a box, ticked to begin with, as in Python."

[cli."revert-objects"]
status = "not-applicable"
reason = "Edits the structure of Python test files."

[cli."translate"]
status = "implemented"
rust = "sbrs translate"
note = "sbrs translate FILE --LANG [-p|--print] [-o|--overwrite] [-c|--copy] [-n|--line-numbers] rewrites the action of every step of a JSON scenario with the translation dictionary; Scenario::from_json reads actions in any of the ten languages. LANG is Python's language flag (--zh, --chinese or --Chinese, ...) and is required; the action is print by default, -p may go with -o or -c, and -c writes FILE_LANG.json."
divergence = "Python translates the method calls of a Python test file. A Rust test is compiled code with English method names, so the file translated here is the JSON scenario."

[cli."unobfuscate"]
status = "composed"
rust = "sbrs decrypt"
note = "Alias of decrypt upstream, as here: `sbrs unobfuscate` is accepted. Tokens are AES-256-GCM under SB_ENCRYPTION_KEY, read from the environment or asked once without echo on a terminal, and do not interchange with Python's. With no argument on a terminal it asks for a token on the screen in a loop as Python does (Ctrl-C prints Exiting... and exits 0)."

