[cli."behave-gui"]
status = "implemented"
rust = "sbrs behave-gui"
note = "Terminal UI instead of Tkinter (feature `tui`): lists the .feature files with their scenarios, runs the ones you mark with `cargo test` (one run per feature, each scenario found by its snake-case title among the test names) and shows the results; without `tui` it prints a hint and exits with status 2, as `sbrs commander` does. `--new` keeps the earlier prompt that writes a new feature file."
divergence = "Python starts `python -m behave` with the browser, session, demo, dashboard, headless, screenshot and extra options. Here the scenarios run as the project's rstest-bdd tests (feature `bdd`), the only run option is a tag filter read from the feature file, and a scenario no test is named after is reported as undefined."

[cli."behave-options"]
status = "implemented"
rust = "sbrs behave-options"
note = "Prints how the behave options map to `sbrs test`: each `-D name[=value]` is the flag of the same name, `--dry-run` is `--co`, `--stop` is `--runner nextest`."
divergence = "Gherkin scenarios are rstest-bdd tests run by `cargo test`, so `-q/--no-snippets` has no meaning (steps are checked at compile time) and `--tags` is `scenarios!(.., tags = ..)` or `-m`."

[cli."case-plans"]
