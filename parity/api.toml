[basecase."install_addon"]
status = "implemented"
rust = "BaseCase::install_addon"
note = "Installs a Firefox add-on, an .xpi file or an unpacked add-on directory, through geckodriver's moz/addon/install command and returns the add-on id; BaseCase::uninstall_addon removes it again. A session that is not Firefox gets an Unsupported error. Tested against a mock WebDriver for the exact endpoint and JSON body. Checked against a real geckodriver 0.37.1 and Firefox 153 ESR in Docker (docker/firefox-check): the same bodies sent with curl installed a directory and an .xpi, the add-on's content script ran, and the uninstall stopped it; tests/install_addon_firefox.rs (ignored) runs BaseCase against that geckodriver and installs and removes an add-on."
divergence = "Takes a temporary flag where Python's install_addon always installs a temporary add-on, and returns the id. Sends geckodriver the path, where Python's Selenium reads the file and sends it as base64, so the file has to be on the machine geckodriver runs on. A path with .. in it, one that does not exist, and one that is neither an .xpi file nor a directory are refused before anything is sent."

