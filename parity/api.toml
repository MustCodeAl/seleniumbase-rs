[basecase."post_message"]
status = "implemented"
rust = "BaseCase::post_message"
note = "Returns a PostMessage builder whose duration(), pause() and style() are Python's keyword arguments: `sb.post_message(text).duration(d).pause(false).style(MessageStyle::Error).await?`. Posts with Messenger, loading it first when the page lacks it. The message is HTML, as in Python; it stays for the duration, else the run's message duration, 0.75 s at most where nobody watches (headless or xvfb), and the call waits for it plus 0.15 s unless pause is false. When Messenger cannot be loaded the message is printed (` * INFO message: text`) and the call still pauses, as in Python; showing a message never fails the test."

