[[example]]
python = "my_first_test.py"
rust_test = "base_case::my_first_test"
status = "pass"
mismatches = [
  "Fixed (finding kept): the port failed in about 6 of 10 runs because the keys typed into saucedemo.com's checkout form never reached the page, and cdp::raw_cdp_swag in about 9 of 10. It was not a timing race in type_text. The login uses saucedemo's password secret_sauce, which Chrome knows as a leaked one; Chrome then shows a data-breach prompt, a part of the browser, and while it is up the browser takes the keyboard (Input.dispatchKeyEvent is answered at once and the page sees no key; waiting longer made it worse, never better). Python starts Chrome with profile.password_manager_leak_detection (and two more password preferences) off; this crate did not. Both engines now do, as Python does (tests/password_prompt_chrome.rs).",
  "Python's update_text waits for the element to be clickable, scrolls to it, clears with 42 backspaces and waits for document.readyState to be complete after the keys; type_text clears and sends keys at once. That difference is real but was not the cause.",
]
next = ""

