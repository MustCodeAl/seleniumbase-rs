seen_in = "test_select_options.py, test_demo_site.py, iframe_tests.py (the body of each `with` is emitted flat, so the frame is entered and never left), test_todomvc.py, test_shadow_dom.py, test_tinymce.py"
fixed = "FIX-CONVERTER: assignments (`let`, or an assignment to the outer variable, which becomes `mut`), `for` over a list, `enumerate` or `range`, `if`/`elif`/`else`, `while`, `try`/`except` (an async block, the first handler runs on an error), `with self.frame_switch(..)` (`sb.frame_switch(..).run(async |sb| { .. }).await?`, so the frame is left), `@parameterized.expand` and `pytest.mark.parametrize` (`#[case]`s) and setUp/tearDown (at the start and end of each test body). A condition it cannot translate keeps its body under `if false` with a TODO; any other `with` block is flattened with a warning."
