# How well this crate runs the real examples of Python SeleniumBase.
#
# Each [[example]] is one Python test (or one file with a single test) from the
# upstream `examples/` folder, ported to `tests/examples_parity_chrome.rs` and
# run headless on a real Chrome. The Python side was run too, headless, with
# `pytest examples/<file> --headless`: every one of them passed, except the
# ones that skip themselves in headless mode (test_tinymce, test_shadow_dom) and
# test_deferred_asserts, which is marked `expected_failure` and fails on purpose.
#
# status
#   pass     the port passed with the same calls (or the nearest composition
#            listed under `mismatches`, which also work as a parity to-do list)
#   fail     the port failed; `mismatches` says why. A port tries the Python
#            call as this crate spells it, notes the step when it fails, runs
#            the nearest composition, and fails at the end, so the list is
#            every difference of the example and not only the first
#   skipped  not ported; `mismatches` says why
# next
#   "bug lane: ..."   a behaviour to fix in src/
#   "parity row: ..." a row of parity/api.toml (done in this lane when it says so)
#   ""                nothing to do
#
# Re-run:
#   cargo test --features "mcp-server test-util testing" --test examples_parity_chrome \
#       -- --ignored --test-threads=1
# The pages are public demo pages, so a failure can be the network: run the
# test again before calling it a mismatch.

[run]
date = "2026-10-30"
chrome = "156.0.8078.48 (headless)"
python_seleniumbase = "4.56.2 (pip), examples from the pinned upstream checkout"
crate = "seleniumbase-rs 0.6.0 (tracks upstream 4.55.2)"
sites = [
  "seleniumbase.io (demo_page, w3schools, coffee, simple/login, other/shadow_dom, drag_and_drop, tinymce, help_docs)",
  "saucedemo.com",
  "todomvc.com",
  "xkcd.com",
  "data: and about:blank pages",
  "chrome://downloads/",
]
tests = "34 ports; the last full run passed 19 and failed 15. Since then my_first_test and raw_cdp_swag were fixed (Chrome's leaked-password prompt) and the four ports that failed on frames (iframe_tests x2, test_checkboxes, w3schools drag and drop) pass after the switch_to_frame, frame_switch, switch_to_window and switch_to_alert fixes, and test_demo_site, test_select_options, test_todomvc_{jquery,react,vue} and test_url_asserts pass after the assertion and form-field fixes, and test_shadow_dom and shadow_root_test pass after the ::shadow fix; the ports were not all run again"

