# ---------------------------------------------------------------------------
# What `sbrs import-python` did with them (sbrs 0.6.0)
# ---------------------------------------------------------------------------
# Run on each file as `sbrs import-python FILE -o OUT --test-name NAME`. The
# warnings and errors per file are in the notes of each [[converter]] entry.

[[converter]]
gap = "Python methods that have a Rust equal are left as a TODO comment ('needs manual migration')"
seen_in = "every file: goto (the first line of all of them), switch_to_frame, switch_to_default_content, switch_to_parent_frame, switch_to_window, open_new_window, get_new_driver, highlight, js_click, set_value, drag_and_drop, hover_and_click, hover_and_js_click, click_visible_elements, assert_link_text, assert_element_not_visible, assert_true, assert_false, assert_equal, assert_in, assert_attribute, select_option_by_value, select_option_by_index, wait_for_element, wait_for_ready_state_complete, clear_local_storage, post_message, activate_demo_mode, set_content_to_frame/parent/default, skip, goto_if_not_url. Every one of them is `implemented` in parity/api.toml."
next = "bug lane: map them in the converter (the line is dropped from the test, so the generated test runs without them and may pass or fail for the wrong reason)"

[[converter]]
gap = "A call whose argument is a variable is an error: 'expected a string literal argument' / 'selector must be a string literal' / 'expected two string literal arguments'; the command exits with 1 and says 'completed with errors', yet the file is written"
seen_in = "test_checkboxes.py (checkbox = 'input#vehicle2'; is_selected(checkbox)), test_select_options.py, test_shadow_dom.py (11 errors), test_tinymce.py, test_todomvc.py (6 errors)"
next = "bug lane: track simple string assignments, f-strings and % formatting, or emit the variable as a Rust let"

[[converter]]
gap = "Python control flow and assignments are dropped, not translated: `x = self.get_text(..)`, `for ... in enumerate(..)`, `if self.headed:`, `try/except`, `with self.frame_switch(..)`, `with` blocks of any kind, `@parameterized.expand`, setUp/tearDown, `self.skip(..)`"
seen_in = "test_select_options.py, test_demo_site.py, iframe_tests.py (the body of each `with` is emitted flat, so the frame is entered and never left), test_todomvc.py, test_shadow_dom.py, test_tinymce.py"
next = "bug lane: emit the statements it cannot translate as a compile_error!-style stub or a failing todo!(), not a comment between running statements"

[[converter]]
gap = "A text assertion without a selector gets 'body'; Python's default selector is 'html' (so assert_text of the <title> or <head> text would differ)"
seen_in = "my_first_test.py (assert_text('Checkout: Overview')), test_window_switching.py"
next = "bug lane: use 'html'"

[[converter]]
gap = "Scripts that are not a BaseCase class are not understood: `sb = sb_cdp.Chrome()`, `with SB(uc=True, test=True) as sb:`, `sb.activate_cdp_mode()`, `sb.cdp.*`; the output is WebDriver BaseCase code with a TODO for goto, and the sb_cdp steps are not mapped to the pure CDP Page/Locator"
seen_in = "all six files of cdp_mode/ that were tried (7 to 22 warnings each)"
next = "bug lane: a --cdp / sb_cdp source mode that writes run_cdp_test with page.locator(..)"

[[converter]]
gap = "The generated test is not headless and not #[ignore]d: `run_browser_test(BrowserConfig::default(), ..)` opens a visible Chrome when run, and the module docstring and `BaseCase.main(__name__, __file__)` are reported as unsupported statements"
seen_in = "every file"
next = "bug lane: BrowserConfig::default().with_headless(..) or a --headless flag, #[ignore = \"starts a real Chrome\"], and ignore the docstring and BaseCase.main line"
