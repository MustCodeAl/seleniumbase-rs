  "Fixed (finding kept): a ::shadow selector in assert_element, type_text, assert_text and click was an error; Python reads it in every method. Every selector-taking method of the WebDriver engine reads it now (BrowserSession::find and find_all cut the selector at each ::shadow and look through the shadow root of each host), and the lookups wait, so assert_text sees 'No search results found' a moment after the typing, as Python's does. The port calls the Python-shaped methods; its shadow_* helpers are gone.",
]
