[package]
name = "tauri-profile-manager"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_profile_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `turso` provides `storage::ProfileVault`, the encrypted profile store.
seleniumbase-rs = { path = "../../..", features = ["turso"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "net"] }
uuid = { version = "1", features = ["v4"] }
actix-web = "4"
actix-cors = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The vault passphrase lives in the operating system's keychain. Keyring 4's
# `v1` feature is the simple API; it pulls in only the store for the target
# platform (Keychain on macOS, Credential Manager on Windows, Secret Service on
# other Unix systems).
keyring = { version = "4.2", default-features = false, features = ["v1"] }
# OS randomness for the generated vault passphrase.
getrandom = "0.4"
# SHA-256 of the legacy files, to recognise one that was already imported.
ring = "0.17"

[dev-dependencies]
# `test-util` adds `sb_cdp::Browser::new_mocked`, so Pure CDP sessions can be
# tested without launching Chrome.
seleniumbase-rs = { path = "../../..", features = ["turso", "test-util"] }
tempfile = "3"
tokio = { version = "1", features = ["macros"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
