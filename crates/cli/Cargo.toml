[package]
name = "seleniumbase-rs-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The sbrs command line and the sbrs-mcp MCP server of seleniumbase-rs."
repository.workspace = true
# Not on crates.io: install it from the repository,
# `cargo install --git https://github.com/MustCodeAl/seleniumbase-rs seleniumbase-rs-cli`.
publish = false
default-run = "sbrs"

# Where `cargo binstall` (and `cargo binstall --git <repository>`) finds the
# prebuilt `sbrs` and `sbrs-mcp`: the archives `.github/workflows/release.yml`
# attaches to the GitHub release of tag v<version>, with both binaries at the
# archive's root. Keep the two in step. The archives are named after the library
# package, as they were before the command line had a crate of its own, so the
# URL does not use `{ name }`. The compile fallback is off because it would build
# from crates.io, where the crate is not published.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/seleniumbase-rs-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "sbrs"
path = "src/sbrs.rs"

[[bin]]
name = "sbrs-mcp"
path = "src/mcp_server.rs"
required-features = ["mcp-server"]

[dependencies]
# The library; every other dependency below is one only the binaries use.
seleniumbase-rs = { path = "../.." }
# The command line parser: derives that generate the parser, the help, the shell
# completions and the usage spec (`completions/sbrs.usage.kdl`) from one declaration.
usage = { package = "usage-rs", version = "6", features = ["completions"] }
# `preserve_order`: `sbrs-mcp install` rewrites a client's JSON config and must keep the order
# of its keys (thirtyfour turns the feature on already).
serde_json = { version = "1.0", features = ["preserve_order"] }
# The same features as the library, so one build of thirtyfour serves both.
thirtyfour = { version = "0.37", default-features = false, features = ["reqwest", "cdp"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "process", "net", "io-util", "fs"] }
# `sbrs install` downloads with `reqwest::get`; the TLS provider is the library's.
reqwest = { version = "0.13", default-features = false }
tempfile = { version = "3.27", default-features = false }
dirs = "7.0"
# The warning for an invalid `SB_*` variable, written once logging works.
tracing = "0.1"
# `sbrs-mcp install`: edits a client's config.toml (Codex) and keeps its comments and
# other tables, and finds the `claude`, `codex` and `code` programs on PATH.
toml_edit = "0.25"
which = "8.0"
# `sbrs encrypt` and `sbrs decrypt` with no argument on a terminal: reads the text and the
# passphrase without echo.
rpassword = "7.5"

[features]
# The prebuilt binaries and `cargo install` carry PDF text extraction, the MCP
# server and the built-in browser plugins (`--plugin NAME`, `sbrs plugin list`), as
# the release workflow builds them. The terminal UI, the desktop dialogs and the
# results database stay opt-in, as in the library.
default = ["pdf", "mcp-server", "mcp-client", "plugins-builtin"]
# The plugin API and its hooks, with no plugin of its own: a build with this and no
# `plugin-*` feature accepts no name, and says which features add one.
plugins = ["seleniumbase-rs/plugins"]
# The built-in plugins, one feature each as in the library, and all of them.
plugin-shield = ["plugins", "seleniumbase-rs/plugin-shield"]
plugin-block-resources = ["plugins", "seleniumbase-rs/plugin-block-resources"]
plugin-crx = ["plugins", "seleniumbase-rs/plugin-crx"]
plugin-fetcher = ["plugins", "seleniumbase-rs/plugin-fetcher"]
plugin-extractor = ["plugins", "seleniumbase-rs/plugin-extractor"]
plugin-batcher = ["plugins", "seleniumbase-rs/plugin-batcher"]
plugin-crawler = ["plugins", "seleniumbase-rs/plugin-crawler"]
plugin-browser = ["plugins", "seleniumbase-rs/plugin-browser"]
plugin-imap = ["plugins", "seleniumbase-rs/plugin-imap"]
plugins-builtin = ["plugins", "seleniumbase-rs/plugins-builtin"]
# `sbrs pdf-text` and `sbrs assert-pdf-text`.
pdf = ["seleniumbase-rs/pdf"]
# The `sbrs-mcp` binary.
mcp-server = ["seleniumbase-rs/mcp-server"]
# `sbrs-mcp tools`, `call`, `resources`, `read`, `prompts` and `prompt`: the MCP client.
mcp-client = ["mcp-server", "seleniumbase-rs/mcp-client"]
# `sbrs commander`, `sbrs behave-gui` and `sbrs caseplans`.
tui = ["seleniumbase-rs/tui"]
# Native dialogs and GUI automation (enigo/rfd).
gui = ["seleniumbase-rs/gui"]
# `sbrs report`: reading a results database.
turso = ["seleniumbase-rs/turso"]
# Scripted mock browser; the scratch crates of the tests turn it on in the library.
test-util = ["seleniumbase-rs/test-util"]
# Extra tracing integrations and tokio-console, as in the library.
full-tracing = ["seleniumbase-rs/full-tracing"]
tokio-console = ["seleniumbase-rs/tokio-console"]

[dev-dependencies]
# Writes the CLI reference page (docs/help/cli_reference.md) from the usage spec in a
# test; usage-lib is the renderer of the usage tool (`usage generate markdown`), and
# the binary does not link it. The same release train as `usage` above.
usage_lib = { package = "usage-lib", version = "6.12", default-features = false, features = ["markdown"] }
# The `report` module's test (feature `turso`) matches a timestamp.
regex = "1.13"
# `cli_scaffold` parses what `sbrs mkfile` and `sbrs mkdir` write.
syn = { version = "3", features = ["full", "visit"] }
# Lists processes for the tests' leftover-process checks on every system (Windows
# has no `pgrep`); only its process part.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
