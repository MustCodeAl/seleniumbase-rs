[package]
name = "sbrs-desktop"
version = "0.11.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Tauri Desktop GUI for running seleniumbase-rs tests, Behave scenarios, Case Plans, and Recorder workflows."
repository = "https://github.com/MustCodeAl/seleniumbase-rs"

# Standalone workspace so GUI/WebView dependencies stay separate from the core
# library and CLI crates.
[workspace]

[lib]
name = "sbrs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "=3.0.0-alpha.6", features = ["unstable"] }
tauri-runtime-wry = "=3.0.0-alpha.6"
tauri-plugin-opener = "=3.0.0-alpha.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "process", "io-util", "sync", "fs", "macros"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
