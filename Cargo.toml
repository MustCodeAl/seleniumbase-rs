[package]
name = "seleniumbase-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Rust port foundation of SeleniumBase with module parity and core browser automation."
repository = "https://github.com/MustCodeAl/seleniumbase-rs"

[lib]
name = "seleniumbase_rs"
path = "src/lib.rs"

[[bin]]
name = "sbase"
path = "src/cli/bin/sbase.rs"

[[example]]
name = "dialog"
required-features = ["gui"]

[[example]]
name = "dialogs"
required-features = ["gui"]

[[example]]
name = "gui_automation"
required-features = ["gui"]

# The measurement tools: they run the local Chrome and write src/wire/measured.
[[example]]
name = "capture_tls"
required-features = ["scrape"]

[[example]]
name = "capture_hints"
required-features = ["scrape"]

# Serves HTTPS with the ephemeral CA, so it needs the BoringSSL stack.
[[example]]
name = "capture_h2"
required-features = ["impersonate"]

[[bin]]
name = "seleniumbase-mcp"
path = "src/bin/mcp_server.rs"
required-features = ["mcp-server"]

# Timing harnesses without a framework: `cargo bench --bench cdp_latency`
# drives a real Chrome, `cargo bench --bench cpu` needs no browser.
[[bench]]
name = "cdp_latency"
harness = false

[[bench]]
name = "cpu"
harness = false

# The scrape domain purity check is gated, so a plain `cargo test` never compiles it.
[[test]]
name = "scrape_domain_purity"
required-features = ["scrape"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
thirtyfour = "0.37"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "process", "net", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-log = "0.2"
tracing-futures = "0.2"
json-subscriber = "0.3"
tracing-timing = { version = "0.7", optional = true }
tracing-actix = { version = "0.4", optional = true }
regex = "1.13"
rand = "0.10"
base64 = "0.23"
reqwest = { version = "0.13", features = ["blocking", "json"] }
url = "2.5"
tokio-tungstenite = "0.30"
futures-util = "0.3"
chrono = "0.4"
enigo = { version = "0.6", optional = true }
ring = "0.17"
zip = "9.0"
flate2 = "1.1"
tar = "0.4"
dirs = "7.0"
pdf-extract = "0.12"
scraper = "0.27"
rfd = { version = "0.17", optional = true }
toml = "1.1"
tempfile = "3.27"
which = "8.0"
async-trait = "0.1"
# `scrape`: the Public Suffix List, for RFC 6265 cookie domains. Pure Rust.
psl = { version = "2.1.241", optional = true }
# `impersonate`: wreq drives BoringSSL through btls (needs cmake and a C/C++ toolchain).
# links = "boringssl" allows one copy of BoringSSL in the graph.
wreq = { version = "=6.0.0-rc.31", optional = true, default-features = false, features = [
    "tokio-rt", "webpki-roots", "gzip", "deflate", "brotli", "zstd", "socks", "stream"] }
btls = { version = "=0.5.6", optional = true }
tokio-btls = { version = "=0.5.6", optional = true }
hyper = { version = "1.12", optional = true, default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", optional = true, default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1.5", optional = true }
http = { version = "1.5", optional = true }
bytes = { version = "1.12", optional = true }
# Optional Playwright-compatible engine via rustwright. Disabled by default
# because it pulls a large Chromium automation core.
rustwright = { version = "0.3", optional = true }
rustwright-core = { version = "0.3", optional = true }
rust-s3 = { version = "0.38", features = ["tokio-native-tls"], optional = true }
azure_storage_blob = { version = "1.1", optional = true }
azure_core = { version = "1.1", optional = true }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"], optional = true }
# Embedded database for test-run reporting and the encrypted profile vault. The
# default features are off because `mimalloc` installs a global allocator,
# which a library must not impose on its users.
turso = { version = "0.8", default-features = false, optional = true }

[features]
# Nothing is on by default: a headless browser pool needs neither the terminal UI
# nor the desktop automation stacks, and `gui` links GTK and X11 on Linux.
default = []
# Interactive Commander TUI (`sbase commander`).
tui = ["dep:ratatui", "dep:crossterm"]
# Native OS dialogs and GUI automation (enigo/rfd).
gui = ["dep:enigo", "dep:rfd"]
# Playwright-compatible automation mode powered by rustwright.
playwright = ["dep:rustwright", "dep:rustwright-core"]
# Extra tracing integrations (timing histograms, actix actor instrumentation).
full-tracing = ["dep:tracing-timing", "dep:tracing-actix"]
# Capture a backtrace for every SeleniumBaseError (useful for debugging).
error-backtrace = []
s3 = ["dep:rust-s3"]
azure = ["dep:azure_storage_blob", "dep:azure_core"]
gcp = []
mcp-server = ["dep:rmcp"]
# Scripted mock browser for testing code that drives pages without Chrome.
test-util = []
# Embedded Turso database: `ResultStore` (test-run reporting, `sbase report`) and
# `ProfileVault` (encrypted browser-profile storage).
turso = ["dep:turso"]
# Stealth scraping without TLS spoofing: domain layer, JSON state store, CDP browser
# leg, TLS and client-hint capture. Pure Rust; adds only `psl`.
scrape = ["dep:psl"]
# Browser-identical TLS, HTTP/2 and headers through wreq and BoringSSL: the MITM proxy,
# HttpSession and StealthSession. Needs cmake and a C/C++ toolchain.
impersonate = ["scrape", "dep:wreq", "dep:btls", "dep:tokio-btls", "dep:hyper", "dep:hyper-util",
               "dep:http-body-util", "dep:http", "dep:bytes"]

[dev-dependencies]
# Paused clocks let tests play out human-paced input instantly.
tokio = { version = "1.53", features = ["test-util"] }
printpdf = "0.12"
syn = { version = "3", features = ["full", "visit"] }
