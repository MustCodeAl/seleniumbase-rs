[package]
name = "seleniumbase-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust port foundation of SeleniumBase with module parity and core browser automation."
repository = "https://github.com/MustCodeAl/SeleniumBase"

[lib]
name = "seleniumbase_rs"
path = "src/lib.rs"

[[bin]]
name = "sbase"
path = "src/cli/bin/sbase.rs"

[[bin]]
name = "seleniumbase-mcp"
path = "src/bin/mcp_server.rs"
required-features = ["mcp-server"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
thirtyfour = "0.37"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-log = "0.2"
tracing-futures = "0.2"
json-subscriber = "0.3"
tracing-timing = { version = "0.7", optional = true }
tracing-actix = { version = "0.4", optional = true }
regex = "1.13"
rand = "0.10"
base64 = "0.23"
reqwest = { version = "0.13", features = ["blocking", "json"] }
url = "2.5"
tokio-tungstenite = "0.30"
futures-util = "0.3"
chrono = "0.4"
enigo = "0.6"
ring = "0.17"
zip = "8.6"
flate2 = "1.1"
tar = "0.4"
dirs = "6.0"
pdf-extract = "0.12"
scraper = "0.27"
rfd = "0.17"
toml = "1.1"
tempfile = "3.8"
which = "8.0"
async-trait = "0.1"
# Optional native Rust CDP engine via rustwright. The crates.io release (0.1.1)
# pins an old serde_json that conflicts with the Azure SDK, so we track the
# latest git tag instead. Disabled by default because it pulls a large Chromium
# automation core.
rustwright = { git = "https://github.com/Skyvern-AI/rustwright", tag = "v0.2.0", optional = true }
rustwright-core = { git = "https://github.com/Skyvern-AI/rustwright", tag = "v0.2.0", optional = true }
rust-s3 = { version = "0.37", features = ["tokio-native-tls"], optional = true }
azure_storage_blob = { version = "1.0", optional = true }
azure_core = { version = "1.0", optional = true }
rmcp = { version = "3.1", default-features = false, features = ["server", "transport-io"], optional = true }

[features]
default = []
# Playwright-compatible automation mode powered by rustwright.
playwright = ["dep:rustwright", "dep:rustwright-core"]
# Extra tracing integrations (timing histograms, actix actor instrumentation).
full-tracing = ["dep:tracing-timing", "dep:tracing-actix"]
# Capture a backtrace for every SeleniumBaseError (useful for debugging).
error-backtrace = []
s3 = ["dep:rust-s3"]
azure = ["dep:azure_storage_blob", "dep:azure_core"]
gcp = []
mcp-server = ["dep:rmcp"]

[dev-dependencies]
printpdf = "0.12"
syn = { version = "3", features = ["full"] }
