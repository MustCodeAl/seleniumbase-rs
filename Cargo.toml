# The library `seleniumbase-rs` is the package at the repository root. The command
# line (`sbrs`, `sbrs-mcp`) is the workspace crate `crates/cli`, so that a project
# that depends on the library compiles no command-line parser, completion
# generator or binary-only dependency.
[workspace]
members = ["crates/cli"]
# A plain `cargo build`, `cargo test` or `cargo run --bin sbrs` at the root covers
# both packages, as it did when the binaries were part of the library. Use
# `-p seleniumbase-rs` for the library alone.
default-members = [".", "crates/cli"]
resolver = "2"
# The Tauri example has a manifest of its own and builds on its own.
exclude = ["examples/tauri-profile-manager/src-tauri"]

# Shared by both packages, so the command line always has the library's version.
[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/MustCodeAl/seleniumbase-rs"

[package]
name = "seleniumbase-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust port foundation of SeleniumBase with module parity and core browser automation."
repository.workspace = true

[lib]
name = "seleniumbase_rs"
path = "src/lib.rs"

[[example]]
name = "dialog"
required-features = ["gui"]

[[example]]
name = "dialogs"
required-features = ["gui"]

[[example]]
name = "gui_automation"
required-features = ["gui"]

[[example]]
name = "pdf_example"
required-features = ["pdf"]

# Timing harnesses without a framework: `cargo bench --bench cdp_latency`
# drives a real Chrome, `cargo bench --bench cpu` needs no browser.
[[bench]]
name = "cdp_latency"
harness = false

[[bench]]
name = "cpu"
harness = false

[dependencies]
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# Without the defaults `component` (derive macros) and `manager` (thirtyfour's own
# driver downloader): this crate has its own, and SelectElement needs neither.
thirtyfour = { version = "0.37", default-features = false, features = ["reqwest", "cdp"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "process", "net", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-log = "0.2"
tracing-timing = { version = "0.7", optional = true }
# Feature `tokio-console`: live view of async tasks for debugging (heavy: gRPC).
console-subscriber = { version = "0.5", optional = true }
regex = "1.13"
rand = "0.10"
# The bell curve of human-paced input (`stealth::humanize::Rng::gaussian`); std math.
rand_distr = { version = "0.6", features = ["std_math"] }
base64 = "0.23"
# No crypto provider of reqwest's own: rustls uses `ring` (see `common::tls`), so
# the aws-lc-sys C library is not built.
reqwest = { version = "0.13", default-features = false, features = ["json", "charset", "http2", "system-proxy", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
url = "2.5"
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
chrono = "0.4"
enigo = { version = "0.6", optional = true }
ring = "0.17"
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The zlib-rs backend zip already builds (lopdf still enables flate2's default one).
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
tar = { version = "0.4", default-features = false }
dirs = "7.0"
pdf-extract = { version = "0.12", optional = true }
# Without `main` (getopts, for scraper's own CLI) and `errors` (unused parse errors).
scraper = { version = "0.27", default-features = false }
rfd = { version = "0.17", optional = true }
toml = "1.1"
tempfile = { version = "3.27", default-features = false }
which = "8.0"
async-trait = "0.1"
# `http` and `bytes` name the types of thirtyfour's `HttpClient` trait, which
# `browser::reuse` implements to attach to a running session. Both are already
# in the graph through thirtyfour.
http = "1.5"
bytes = "1.12"
# Optional Playwright-compatible engine via rustwright. Disabled by default
# because it pulls a large Chromium automation core.
rustwright = { version = "0.3", optional = true }
rust-s3 = { version = "0.38", features = ["tokio-native-tls"], optional = true }
azure_storage_blob = { version = "1.1", optional = true }
azure_core = { version = "1.1", optional = true }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"], optional = true }
# Embedded database for test-run reporting and the encrypted profile vault. The
# default features are off because `mimalloc` installs a global allocator,
# which a library must not impose on its users.
turso = { version = "0.8", default-features = false, optional = true }
# `ocr`: pure-Rust OCR (ocrs on the rten inference engine) and a PNG decoder for
# screenshots. The models are downloaded on first use, not bundled.
ocrs = { version = "0.13", optional = true }
rten = { version = "0.26", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
# `plugins`: the plugin API (ADR 004), from its own repository until it is on
# crates.io, and the aggregator of the built-in plugins (one cargo feature each).
# BOTH lines must name the same git URL and the same `rev`: Cargo counts two
# specs as two sources, builds two `seleniumbase-rs-plugin` crates, and then the
# `Plugin` a built-in implements is not the one this crate calls.
# `tests/plugin_features.rs` fails when they differ. A plugin crate added with
# `cargo add --git` needs the same `--rev` (see docs/tutorials/plugins.md).
seleniumbase-rs-plugin = { version = "0.1", git = "https://github.com/MustCodeAl/seleniumbase-rs-plugins", rev = "628991af0e6c5711298e3bd3692dc2974887401a", optional = true }
seleniumbase-rs-plugins-builtin = { version = "0.1", git = "https://github.com/MustCodeAl/seleniumbase-rs-plugins", rev = "628991af0e6c5711298e3bd3692dc2974887401a", optional = true }
# `visual`: structural similarity (SSIM) between a screenshot and its baseline.
# MIT; no default features; brings rayon and itertools, and `image` without
# defaults (the PNG codec comes from the `image` line above).
image-compare = { version = "0.5", optional = true }
# `testing`: the `#[fixture]` attribute of the `sb` and `sb_cdp` fixtures. No default
# features: the fixture needs neither the async-timeout nor the crate-rename support
# (a test crate that uses `#[rstest]` chooses its own).
rstest = { version = "0.26", default-features = false, optional = true }
# `bdd`: Gherkin features through rstest-bdd (see the feature below).
rstest-bdd = { version = "0.6", optional = true }
rstest-bdd-macros = { version = "0.6", optional = true }
rstest-bdd-harness = { version = "0.6", optional = true }
rstest-bdd-harness-tokio = { version = "0.6", optional = true }

[features]
# Nothing is on by default: a headless browser pool needs neither the terminal UI
# nor the desktop automation stacks, and `gui` links GTK and X11 on Linux.
default = []
# Interactive Commander TUI (`sbrs commander`).
tui = ["dep:ratatui", "dep:crossterm"]
# Native OS dialogs and GUI automation (enigo/rfd).
gui = ["dep:enigo", "dep:rfd"]
# Playwright-compatible automation mode powered by rustwright (pure Rust; no Python).
# rustwright depends on rustwright-core without its `python` feature, so no
# libpython is linked.
playwright = ["dep:rustwright"]
# Extra tracing integrations (timing histograms, actix actor instrumentation).
full-tracing = ["dep:tracing-timing"]
# Serves tokio-console (https://github.com/tokio-rs/console). Build with
# RUSTFLAGS="--cfg tokio_unstable"; never on by default.
tokio-console = ["dep:console-subscriber", "tokio/tracing"]
# Capture a backtrace for every SeleniumBaseError (useful for debugging).
error-backtrace = []
s3 = ["dep:rust-s3"]
azure = ["dep:azure_storage_blob", "dep:azure_core"]
gcp = []
mcp-server = ["dep:rmcp"]
# Scripted mock browser for testing code that drives pages without Chrome.
test-util = []
# Embedded Turso database: `ResultStore` (test-run reporting, `sbrs report`) and
# `ProfileVault` (encrypted browser-profile storage).
turso = ["dep:turso"]
# Reads text from screenshots and images (`ocr::Ocr`): ocrs, pure Rust. Its two
# models (about 12 MB) are downloaded into the cache folder on first use.
ocr = ["dep:ocrs", "dep:rten", "dep:image"]
# Browser plugins (ADR 004) for both engines: `LaunchOptionsBuilder::plugins`
# (pure CDP) and `BrowserConfig::with_plugins` (WebDriver), with hooks at launch,
# connect, every new tab or window and close. The API is re-exported as
# `seleniumbase_rs::plugin_api`.
plugins = ["dep:seleniumbase-rs-plugin"]
# The built-in plugins, one feature each; each turns on `plugins` and compiles
# only its own plugin crate. They are enabled by name: `[plugins] enable = [...]`
# in the settings file, `SB_PLUGINS`, or `plugins_named` on the launch builders.
plugin-shield = ["plugins", "dep:seleniumbase-rs-plugins-builtin", "seleniumbase-rs-plugins-builtin/shield"]
plugin-block-resources = ["plugins", "dep:seleniumbase-rs-plugins-builtin", "seleniumbase-rs-plugins-builtin/block-resources"]
plugin-crx = ["plugins", "dep:seleniumbase-rs-plugins-builtin", "seleniumbase-rs-plugins-builtin/crx"]
# Every built-in plugin.
plugins-builtin = ["plugin-shield", "plugin-block-resources", "plugin-crx"]
# Visual regression testing (`visual::VisualBaseline`,
# `BaseCase::assert_visual_match`): screenshots compared with a saved baseline
# by structural similarity, with a diff image on a mismatch. Pure Rust.
visual = ["dep:image-compare", "dep:image"]
# PDF text extraction: the module `api::pdf`, `BaseCase::get_pdf_text` and
# `assert_pdf_text`, and `sbrs pdf-text` / `assert-pdf-text`. It is optional because
# pdf-extract (lopdf, fonts, ciphers) is 34 of the crates of a default build.
pdf = ["dep:pdf-extract"]
# Test fixtures for `cargo test`: `testing::{sb, sb_cdp}` (rstest), the per-test lifecycle
# that reads the run configuration (reruns, time limit, evidence on failure, debug
# prompts) and the test id. See `docs/tutorials/writing_tests.md`.
testing = ["dep:rstest"]
# Gherkin features as cargo tests (rstest-bdd; replaces the removed `behave` module):
# `testing::bdd::{sb, sb_cdp, SbCase, SbCdpCase}`. The four crates are
# optional and the macros' own dependency tree (i18n, rust-embed, gherkin) comes with them.
bdd = ["testing", "dep:rstest-bdd", "dep:rstest-bdd-macros", "dep:rstest-bdd-harness", "dep:rstest-bdd-harness-tokio"]
# Allure results (`core::allure`, `SB_ALLURE_DIR`). The feature has no dependency yet: the
# lane that writes the results adds `dep:allure-rust-commons` here.
allure = []

[dev-dependencies]
# Paused clocks let tests play out human-paced input instantly.
tokio = { version = "1.53", features = ["test-util"] }
printpdf = "0.12"
syn = { version = "3", features = ["full", "visit"] }
# With line and column of a span, so the test that writes the `find_api` index
# (`src/mcp/dev/api/index_gen.rs`) can cut a signature out of the source as written.
proc-macro2 = { version = "1", features = ["span-locations"] }
# Lists processes for the tests' leftover-process checks on every system (Windows
# has no `pgrep`); only its process part.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Writes `schemas/fingerprint.schema.json` from the types. Only the library's own tests
# derive `JsonSchema` (`cfg_attr(test, ..)`), so nothing of it reaches a user of the crate.
schemars = "1.2"
# Parses the JUnit XML the tests write (`src/core/junit.rs`), so a test fails on XML that is not
# well formed. Test-only; it has no dependencies of its own.
roxmltree = "0.21"

