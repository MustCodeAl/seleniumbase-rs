# cargo-deny configuration — supply-chain gate for seleniumbase-rs.
#
# Run locally with `cargo deny --workspace check`. CI runs the same command, so
# every exception below has to be written down and reviewed rather than silently
# tolerated.
#
# `--workspace` matters: the root manifest is a package as well as the workspace,
# so without it cargo-deny roots the graph at the library alone and never sees
# `crates/cli` (the binaries) or its dependencies. That is how RUSTSEC-2026-0414
# (pulldown-cmark, through usage-lib) went unreported until 2026-10-31.

[graph]
all-features = true

[advisories]
# Each ignore needs a rationale and, where the fix is upstream, a pointer to
# what we are waiting on.
ignore = [
    # RUSTSEC-2025-0141: bincode 1.x unmaintained. Reached only through
    # printpdf -> azul-layout -> hyphenation, and printpdf is a
    # dev-dependency, so this never ships in the library or the binaries.
    "RUSTSEC-2025-0141",

    # RUSTSEC-2025-0057: fxhash unmaintained. Reached only through
    # tracing-timing, behind the optional `full-tracing` feature. Used for
    # histogram bookkeeping on non-adversarial input.
    "RUSTSEC-2025-0057",

    # RUSTSEC-2026-0374: basic-toml unmaintained. Reached only through
    # rstest-bdd -> i18n-embed -> i18n-embed-impl (a proc macro) ->
    # i18n-config, behind the optional `bdd` feature for writing Gherkin
    # tests: it reads the macro crate's own i18n.toml at build time and never
    # ships in the library or the binaries. Drop this once rstest-bdd or
    # i18n-embed moves to the `toml` crate.
    "RUSTSEC-2026-0374",

    # RUSTSEC-2026-0192: ttf-parser unmaintained. Reached through
    # pdf-extract -> lopdf for font handling while parsing PDFs. Revisit if
    # pdf-extract stays on an unmaintained lopdf line.
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    # libbz2-rs-sys (via zip -> bzip2) ships under the permissive, BSD-style
    # bzip2 license, which has no SPDX short identifier of its own.
    "bzip2-1.0.6",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `crates/cli` and `crates/own-imports` (both `publish = false`) depend on the
# library by path alone; a published crate still may not.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The plugin API (feature `plugins`) comes from its own repository, pinned to a
# revision, until it is published on crates.io.
allow-git = ["https://github.com/MustCodeAl/seleniumbase-rs-plugins"]
